
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Secure Cloud Storage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-card">
    <div class="logo">☁</div>
    <h1>Secure Cloud</h1>
    <h2>Create Account</h2>
    <p class="subtitle">Create an account to store your files securely.</p>

    <form id="signupForm">
      <label for="signupName">Full Name</label>
      <input type="text" id="signupName"
             placeholder="Enter your full name" required>

      <label for="signupEmail">Email Address</label>
      <input type="email" id="signupEmail"
             placeholder="Enter your email" required>

      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword"
             placeholder="Create a password" minlength="8" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword"
             placeholder="Re-enter your password" minlength="8" required>

      <button type="submit">Sign Up</button>
      <p id="signupMessage" class="message"></p>
    </form>

    <p class="switch">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
