
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Cloud Storage</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f8faff);
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(30, 55, 100, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1, h2 {
            text-align: center;
            color: #192c60;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 23px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin: 12px 0 25px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6dce8;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #3159b7;
            box-shadow: 0 0 0 3px rgba(49, 89, 183, 0.1);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 7px;
            background: #3159b7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #203f91;
        }

        .message {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .switch {
            margin-top: 24px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        a {
            color: #3159b7;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <div class="logo">☁️</div>

        <h1>Secure Cloud</h1>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to access your files securely.
        </p>

        <form id="loginForm">

            <label for="loginEmail">Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="loginPassword">Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="8"
                pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                title="Password must contain at least 8 characters, including one alphabet and one number."
                required
            >

            <button type="submit">Login</button>

            <p id="loginMessage" class="message" role="status"></p>

        </form>

        <p class="switch">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
